<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{% if page.teaser %}{{ page.teaser }}{% else %}{{ site.description }}{% endif %}">
  <meta name="theme-color" content="#0c0d0f">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="mark" viewBox="0 0 64 40" aria-hidden="true" focusable="false">
          <path d="M4 34 L20 10 L29 21 L40 4 L60 34"/>
        </svg>
        <span class="brand-text">
          <span class="brand-mark">The Shoulder Season</span>
          <span class="brand-tag">{{ site.tagline }}</span>
        </span>
      </a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on"{% endif %}>Today</a>
        <a href="{{ '/diary/' | relative_url }}"{% if page.url == '/diary/' %} class="on"{% endif %}>Diary</a>
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} class="on"{% endif %}>Archive</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="on"{% endif %}>About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="footer">
    <div class="wrap">
      <p><strong>The Shoulder Season</strong> is an independent daily briefing on New Zealand's visitor economy.</p>
      <p>&copy; {{ site.time | date: "%Y" }} The Shoulder Season &middot; <a href="{{ '/diary/' | relative_url }}">Diary</a> &middot; <a href="{{ '/archive/' | relative_url }}">Archive</a> &middot; <a href="{{ '/about/' | relative_url }}">About</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </footer>
</body>
</html>
